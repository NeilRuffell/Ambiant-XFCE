name: Convert remaining Mint green theme assets
on:
  push:
    branches: [xfce-panel-integration]
    paths:
      - 'scripts/recolour-orange-assets.py'
      - '.github/workflows/orange-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recolour:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Recolour accent image assets
        run: python scripts/recolour-orange-assets.py | tee /tmp/green-asset-audit.txt
      - name: Commit theme assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add usr/share/themes
          if ! git diff --cached --quiet; then
            git commit -m 'Recolour remaining Mint accent UI assets to Ubuntu orange'
            git push
          fi
